name: Scrape fraud patterns

on:
  schedule:
    - cron: "0 22 1 * *" # Monthly, day 1, 06:00 Asia/Taipei
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refactor/modularize

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        working-directory: line-bot
        run: python scrape_165.py

      - name: Commit updated fraud cache
        id: commit
        working-directory: line-bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/data/fraud_patterns.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "fraud_patterns.json has no changes"
          else
            git commit -m "chore: update fraud pattern cache"
            git push origin HEAD:refactor/modularize
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy updated data to Vercel
        if: steps.commit.outputs.changed == 'true' && env.VERCEL_TOKEN != '' && env.VERCEL_PROJECT_ID != '' && env.VERCEL_ORG_ID != ''
        working-directory: line-bot
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"line-bot"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
